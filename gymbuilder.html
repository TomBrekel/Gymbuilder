<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="GymBuilder">
<meta name="theme-color" content="#0a0a14">
<title>GymBuilder</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{--bg:#0a0a14;--surf:#14141e;--surf2:#0d0d18;--bord:#1e1e2e;--bord2:#2a2a3a;--acc:#00E5FF;--acc-bg:rgba(0,229,255,0.08);--txt:#e8e8f0;--mut:#6b6b80;--suc:#00e676;--dan:#ff5252;--warn:#ffaa00}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);height:100dvh;overflow:hidden;display:flex;flex-direction:column}
  #ga{display:flex;flex-direction:column;height:100%;max-width:500px;margin:0 auto;width:100%;background:var(--bg)}
  .gh{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bord);background:var(--surf2);flex-shrink:0;gap:8px;min-height:54px;padding-top:max(12px,env(safe-area-inset-top))}
  .gc{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px;background:var(--bg)}
  .gn{display:flex;border-top:1px solid var(--bord);background:var(--surf2);flex-shrink:0;padding-bottom:max(8px,env(safe-area-inset-bottom))}
  .ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 7px;cursor:pointer;color:var(--mut);font-size:10px;border:none;background:none;font-family:inherit}
  .ni.a{color:var(--acc)}.ni .icon{font-size:20px;line-height:1}
  .card{background:var(--surf);border:1px solid var(--bord);border-radius:14px;padding:14px;margin-bottom:10px}
  .btn{display:inline-flex;align-items:center;gap:5px;padding:8px 13px;border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--bord2);background:transparent;color:var(--txt);font-family:inherit;-webkit-appearance:none;transition:opacity 0.1s}
  .btn:active{opacity:0.7}
  .bp{background:var(--acc);border-color:var(--acc);color:#0a0a14;font-weight:700}
  .bd{border-color:var(--dan);color:var(--dan)}
  .bg{border-color:var(--suc);color:var(--suc)}
  .chip{display:inline-block;padding:5px 12px;border-radius:99px;font-size:12px;cursor:pointer;border:1px solid var(--bord2);margin:0 5px 6px 0;color:var(--mut);background:var(--surf)}
  .chip.on{background:var(--acc-bg);border-color:var(--acc);color:var(--acc)}
  .ni2{text-align:center;font-family:'Menlo','Courier New',monospace;font-size:13px;padding:6px 4px;background:var(--surf2);border:1px solid var(--bord2);border-radius:8px;color:var(--txt);-webkit-appearance:none;width:54px}
  .ni2w{width:70px}
  .ni2r{width:62px}
  .ni2:focus{border-color:var(--acc);outline:none}
  .ck{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--bord2);background:transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;color:transparent}
  .ck.done{background:var(--suc);border-color:var(--suc);color:#0a0a14}
  .sl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.7px;color:var(--mut);margin-bottom:8px}
  .pb{height:4px;background:var(--bord2);border-radius:2px;overflow:hidden;flex:1}
  .pf{height:100%;background:var(--acc);border-radius:2px;transition:width 0.3s}
  .warn{background:rgba(255,170,0,0.1);border:1px solid rgba(255,170,0,0.3);border-radius:10px;padding:9px 12px;font-size:12px;color:var(--warn);margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .sr{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--bord)}
  .sr:last-child{border-bottom:none}
  .sn{font-family:'Menlo','Courier New',monospace;font-size:12px;color:var(--mut);width:22px;flex-shrink:0;text-align:right}
  .lbl{font-size:11px;color:var(--mut);flex-shrink:0}
  .div{height:1px;background:var(--bord);margin:14px 0}
  .fulbtn{width:100%;justify-content:center}
  .empty{text-align:center;padding:48px 16px;color:var(--mut)}
  .empty .ico{font-size:44px;display:block;margin-bottom:14px}
  .import-banner{background:rgba(0,230,118,0.08);border:1.5px solid var(--suc);border-radius:14px;padding:16px;margin-bottom:12px}
  .inp{width:100%;padding:12px 14px;font-size:16px;font-family:inherit;background:var(--surf);border:1px solid var(--bord2);border-radius:12px;color:var(--txt);outline:none}
  .inp:focus{border-color:var(--acc)}
  .ex-card{background:var(--surf);border:1px solid var(--bord);border-radius:12px;margin-bottom:8px;overflow:hidden}
  .ex-hdr{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--bord)}
  .ex-body{padding:8px 12px 10px}
  input[type=text],input[type=number],input[type=date]{font-size:16px;color-scheme:dark}
  input[type=date]{padding:10px 12px;background:var(--surf);border:1px solid var(--bord2);border-radius:10px;color:var(--txt);font-family:inherit;outline:none;flex:1}
  input[type=date]:focus{border-color:var(--acc)}
</style>
</head>
<body>
<div id="ga">
  <div id="gh" class="gh"></div>
  <div id="gc" class="gc" style="display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:14px">Laden...</div>
  <div id="gn" class="gn"></div>
</div>
<script>
const MG=[{id:'chest',lb:'Borst'},{id:'back',lb:'Rug'},{id:'legs',lb:'Benen'},{id:'shoulders',lb:'Schouders'},{id:'arms',lb:'Armen'},{id:'core',lb:'Core'}];
const EX={
  chest:[{id:'bench',nm:'Bench Press',tp:'Compound'},{id:'incline',nm:'Incline Bench Press',tp:'Compound'},{id:'cable_fly',nm:'Cable Fly',tp:'Isolatie'},{id:'dips',nm:'Dips (borst)',tp:'Compound'},{id:'db_press',nm:'Dumbbell Press',tp:'Compound'},{id:'pec_deck',nm:'Pec Deck',tp:'Isolatie'}],
  back:[{id:'deadlift',nm:'Deadlift',tp:'Compound'},{id:'pullup',nm:'Pull-up',tp:'Compound'},{id:'lat_pd',nm:'Lat Pulldown',tp:'Compound'},{id:'s_row',nm:'Seated Cable Row',tp:'Compound'},{id:'db_row',nm:'Dumbbell Row',tp:'Compound'},{id:'face_pull',nm:'Face Pull',tp:'Isolatie'}],
  legs:[{id:'squat',nm:'Squat',tp:'Compound'},{id:'leg_press',nm:'Leg Press',tp:'Compound'},{id:'rdl',nm:'Romanian Deadlift',tp:'Compound'},{id:'leg_ext',nm:'Leg Extension',tp:'Isolatie'},{id:'leg_curl',nm:'Leg Curl',tp:'Isolatie'},{id:'calf',nm:'Calf Raise',tp:'Isolatie'},{id:'bss',nm:'Bulgarian Split Squat',tp:'Compound'}],
  shoulders:[{id:'ohp',nm:'Overhead Press',tp:'Compound'},{id:'lat_r',nm:'Lateral Raise',tp:'Isolatie'},{id:'front_r',nm:'Front Raise',tp:'Isolatie'},{id:'arnold',nm:'Arnold Press',tp:'Compound'},{id:'rear_fly',nm:'Rear Delt Fly',tp:'Isolatie'}],
  arms:[{id:'bb_curl',nm:'Barbell Curl',tp:'Isolatie'},{id:'hammer',nm:'Hammer Curl',tp:'Isolatie'},{id:'preacher',nm:'Preacher Curl',tp:'Isolatie'},{id:'pushdown',nm:'Tricep Pushdown',tp:'Isolatie'},{id:'skull',nm:'Skull Crusher',tp:'Isolatie'},{id:'oh_tri',nm:'Overhead Tricep Ext.',tp:'Isolatie'}],
  core:[{id:'plank',nm:'Plank',tp:'Isometrisch'},{id:'crunches',nm:'Crunches',tp:'Isolatie'},{id:'leg_raise',nm:'Hanging Leg Raise',tp:'Isolatie'},{id:'ab_wheel',nm:'Ab Wheel Rollout',tp:'Compound'},{id:'cable_cr',nm:'Cable Crunch',tp:'Isolatie'}]
};

const S={view:'routines',routines:[],history:[],weights:[],active:null,builder:null,bmg:'chest',importData:null};

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function fmtD(ts){return new Date(ts).toLocaleDateString('nl-NL',{day:'numeric',month:'short',year:'2-digit'})}
function fmtDur(ms){const m=Math.round(ms/60000);return m<60?m+' min':Math.floor(m/60)+'u '+m%60+'m'}
function fmtDate(d){return new Date(d+'T00:00:00').toLocaleDateString('nl-NL',{day:'numeric',month:'short'})}
function today(){return new Date().toISOString().slice(0,10)}
function mgl(id){return(MG.find(m=>m.id===id)||{lb:id}).lb}
function el(id){return document.getElementById(id)}

// Normalize exercise sets: old format {sets:4,reps:8,weight:80} → new format {sets:[{r:'8',w:80},...]}
function normSets(ex){
  if(Array.isArray(ex.sets))return ex.sets;
  return Array.from({length:parseInt(ex.sets)||4},()=>({r:String(ex.reps||8),w:parseFloat(ex.weight)||0}));
}


function openData(){
  const all={routines:S.routines,history:S.history,weights:S.weights};
  const encoded=btoa(encodeURIComponent(JSON.stringify(all)));
  const box=el('export-box');if(box)box.value=encoded;
  el('import-box').value='';
  el('data-modal').style.display='flex';
}
function closeData(){el('data-modal').style.display='none';}
function copyExport(){
  const box=el('export-box');if(!box)return;
  box.select();
  if(navigator.clipboard){navigator.clipboard.writeText(box.value).then(()=>alert('✅ Gekopieerd! Plak dit op je andere apparaat.'));}
  else{document.execCommand('copy');alert('✅ Gekopieerd!');}
}
function doImportAll(){
  const val=el('import-box').value.trim();
  if(!val){alert('Plak eerst een code.');return;}
  try{
    const data=JSON.parse(decodeURIComponent(atob(val)));
    if(!data.routines)throw new Error('Ongeldige code');
    if(!confirm('Weet je zeker? Dit overschrijft je huidige data op dit apparaat.'))return;
    S.routines=data.routines||[];S.history=data.history||[];S.weights=data.weights||[];
    saveR();saveH();saveW();
    closeData();render();
    alert('✅ Data geïmporteerd!');
  }catch(e){alert('Ongeldige code. Kopieer hem opnieuw.');}
}
function loadAll(){
  try{S.routines=JSON.parse(localStorage.getItem('gym_r')||'[]');}catch(e){S.routines=[];}
  try{S.history=JSON.parse(localStorage.getItem('gym_h')||'[]');}catch(e){S.history=[];}
  try{S.weights=JSON.parse(localStorage.getItem('gym_w')||'[]');}catch(e){S.weights=[];}
  try{const a=localStorage.getItem('gym_a');S.active=a?JSON.parse(a):null;}catch(e){S.active=null;}
}
function saveR(){try{localStorage.setItem('gym_r',JSON.stringify(S.routines));}catch(e){}}
function saveH(){try{localStorage.setItem('gym_h',JSON.stringify(S.history));}catch(e){}}
function saveW(){try{localStorage.setItem('gym_w',JSON.stringify(S.weights));}catch(e){}}
function saveA(){try{S.active?localStorage.setItem('gym_a',JSON.stringify(S.active)):localStorage.removeItem('gym_a');}catch(e){}}

function checkImport(){
  try{const p=new URLSearchParams(location.search).get('import');if(!p)return;const data=JSON.parse(decodeURIComponent(atob(p)));if(data&&data.name&&data.exercises)S.importData=data;history.replaceState({},'',location.pathname);}catch(e){}
}
function shareRoutine(id){
  const r=S.routines.find(x=>x.id===id);if(!r)return;
  try{
    const encoded=btoa(encodeURIComponent(JSON.stringify({name:r.name,exercises:r.exercises})));
    const path=location.pathname.endsWith('.html')?location.pathname:location.pathname+'.html';
    const url=location.origin+path+'?import='+encoded;
    const modal=el('qr-modal');const qrDiv=el('qr-code');
    el('qr-title').textContent=r.name;
    qrDiv.innerHTML='';
    modal.style.display='flex';
    const img=document.createElement('img');img.src='https://api.qrserver.com/v1/create-qr-code/?size=200x200&data='+encodeURIComponent(url);img.width=200;img.height=200;img.style.borderRadius='6px';img.onerror=function(){qrDiv.innerHTML='<p style="color:#ff5252;font-size:13px">Geen internet. Kopieer de link:</p><input value="'+url+'" style="width:100%;font-size:10px;padding:6px;margin-top:6px;background:#0d0d18;border:1px solid #2a2a3a;border-radius:6px;color:#e8e8f0" readonly onclick="this.select()">';};qrDiv.appendChild(img);
  }catch(e){alert('Kon de QR-code niet aanmaken.');}
}
function closeQR(){el('qr-modal').style.display='none';}
function importRoutine(){if(!S.importData)return;S.routines.push({id:uid(),name:S.importData.name,exercises:S.importData.exercises.map(e=>({...e,uid:uid()})),createdAt:Date.now()});saveR();S.importData=null;render();}
function dismissImport(){S.importData=null;render();}

function nav(v){S.view=v;render();}
function render(){rHdr();rNav();const gc=el('gc');gc.style.display='';gc.style.alignItems='';gc.style.justifyContent='';if(S.view==='routines')gc.innerHTML=htmlR();else if(S.view==='builder')gc.innerHTML=htmlB();else if(S.view==='workout')gc.innerHTML=htmlW();else if(S.view==='weight')gc.innerHTML=htmlWt();else gc.innerHTML=htmlH();}

function rHdr(){const gh=el('gh');const logo=`<span style="font-size:15px;font-weight:800;letter-spacing:1px;color:var(--acc)">GYM</span><span style="font-size:15px;font-weight:800;letter-spacing:1px;color:var(--txt)">BUILDER</span>`;if(S.view==='builder'){gh.innerHTML=`<button class="btn" style="padding:6px 10px;color:var(--acc);border-color:var(--bord2)" onclick="nav('routines')">&#8592;</button><span style="font-size:15px;font-weight:600;flex:1;margin-left:4px">${S.builder?.editId?'Bewerken':'Nieuwe routine'}</span><button class="btn bp" style="padding:7px 14px" onclick="saveRoutine()">&#10003; Opslaan</button>`;}else if(S.view==='workout'){gh.innerHTML=`<span style="font-size:15px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--acc)">${S.active?.routineName||'Workout'}</span>`;}else{gh.innerHTML=logo+`<button onclick="openData()" style="background:transparent;border:none;font-size:20px;cursor:pointer;padding:4px">⚙️</button>`;}}

function rNav(){const gn=el('gn');const views=[{v:'routines',ico:'📋',lb:'Routines'},{v:'weight',ico:'⚖️',lb:'Gewicht'},{v:'history',ico:'📅',lb:'Historie'},...(S.active?[{v:'workout',ico:'▶️',lb:'Bezig'}]:[])];gn.innerHTML=views.map(x=>`<button class="ni ${S.view===x.v?'a':''}" onclick="nav('${x.v}')"><span class="icon">${x.ico}</span>${x.lb}${x.v==='workout'?'<span style="background:var(--acc);color:#0a0a14;border-radius:99px;padding:0 5px;font-size:9px;margin-left:2px;font-weight:800">1</span>':''}</button>`).join('');}

// --- ROUTINES ---
function htmlR(){
  const banner=S.importData?`<div class="import-banner"><div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="font-size:20px">📥</span><div><div style="font-weight:700;font-size:15px;color:var(--suc)">${S.importData.name}</div><div style="font-size:12px;color:var(--mut)">${S.importData.exercises.length} oefeningen ontvangen</div></div></div><div style="font-size:13px;margin-bottom:12px">${S.importData.exercises.map(e=>`<span style="display:inline-block;background:var(--acc-bg);border:1px solid var(--bord2);color:var(--acc);padding:2px 8px;border-radius:6px;margin:2px 3px 2px 0;font-size:12px">${e.name}</span>`).join('')}</div><div style="display:flex;gap:8px"><button class="btn bg" style="flex:1;justify-content:center;font-size:14px;padding:10px" onclick="importRoutine()">💾 Opslaan in mijn routines</button><button class="btn" style="padding:10px 12px" onclick="dismissImport()">✕</button></div></div>`:'';
  if(!S.routines.length)return banner+`<div class="empty"><span class="ico">🏋️</span><p style="font-size:15px;margin-bottom:18px">Nog geen routines aangemaakt.</p><button class="btn bp" style="padding:10px 20px;font-size:15px" onclick="newRoutine()">+ Eerste routine</button></div>`;
  return banner+S.routines.map(r=>{
    const ts=r.exercises.reduce((s,x)=>s+normSets(x).length,0);
    const mgs=[...new Set(r.exercises.map(e=>e.mg))];
    const tags=mgs.map(m=>`<span style="display:inline-block;padding:3px 8px;border-radius:6px;font-size:11px;background:var(--surf2);color:var(--mut);border:1px solid var(--bord);margin-right:4px;margin-top:4px">${mgl(m)}</span>`).join('');
    return`<div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px"><div><div style="font-weight:600;font-size:16px;margin-bottom:3px">${r.name}</div><div style="font-size:13px;color:var(--mut)">${r.exercises.length} oef. · ${ts} sets</div></div><div style="display:flex;gap:5px;flex-shrink:0"><button class="btn" style="padding:6px 9px;font-size:15px" onclick="shareRoutine('${r.id}')">🔗</button><button class="btn bd" style="padding:6px 9px" onclick="delR('${r.id}')">🗑</button><button class="btn" style="padding:6px 9px" onclick="editR('${r.id}')">✏️</button><button class="btn bp" style="padding:6px 14px" onclick="startW('${r.id}')">▶ Start</button></div></div><div>${tags}</div></div>`;
  }).join('')+`<button class="btn bp fulbtn" style="margin-top:4px;padding:12px" onclick="newRoutine()">+ Nieuwe routine</button>`;}

function newRoutine(){S.builder={editId:null,name:'',exercises:[]};S.bmg='chest';nav('builder');}
function editR(id){const r=S.routines.find(x=>x.id===id);if(!r)return;S.builder={editId:id,name:r.name,exercises:r.exercises.map(e=>({...e,sets:normSets(e)}))};S.bmg='chest';nav('builder');}
function delR(id){if(!confirm('Routine verwijderen?'))return;S.routines=S.routines.filter(r=>r.id!==id);saveR();render();}
function startW(id){
  if(S.active){nav('workout');return;}
  const r=S.routines.find(x=>x.id===id);if(!r)return;
  S.active={routineId:id,routineName:r.name,startTime:Date.now(),exercises:r.exercises.map(ex=>{
    const sets=normSets(ex);
    return{uid:ex.uid||uid(),exId:ex.exId,mg:ex.mg,name:ex.name,sets:sets.map(s=>({tr:s.r,tw:s.w,done:false,ar:'',aw:''}))};
  })};
  saveA();nav('workout');
}

// --- BUILDER ---
function mkEx(exId,mg,name){return{uid:uid(),exId,mg,name,sets:[{r:'8',w:0},{r:'8',w:0},{r:'8',w:0},{r:'8',w:0}]};}

function bExHtml(){
  const b=S.builder;
  if(!b.exercises.length)return`<p style="font-size:14px;color:var(--mut);padding:10px 0">Nog geen oefeningen toegevoegd.</p>`;
  return b.exercises.map((ex,ei)=>{
    const sets=ex.sets||[];
    const setRows=sets.map((s,si)=>`
      <div class="sr">
        <span class="sn">S${si+1}</span>
        <input type="text" class="ni2 ni2r" value="${s.r}" placeholder="8" oninput="bUpdSet('${ex.uid}',${si},'r',this.value)" aria-label="Herhalingen">
        <span class="lbl">reps</span>
        <span class="lbl" style="color:var(--bord2)">@</span>
        <input type="number" class="ni2 ni2w" value="${s.w||''}" placeholder="kg" min="0" max="999" step="0.5" oninput="bUpdSet('${ex.uid}',${si},'w',+this.value)" aria-label="Gewicht">
        <span class="lbl">kg</span>
        <button class="btn" style="padding:4px 7px;flex-shrink:0;margin-left:auto" onclick="bRemSet('${ex.uid}',${si})" aria-label="Verwijder set">✕</button>
      </div>`).join('');
    return`<div class="ex-card">
      <div class="ex-hdr">
        <div style="display:flex;flex-direction:column;gap:2px;flex-shrink:0">
          <button class="btn" style="padding:2px 6px;font-size:11px;border-color:var(--bord2);${ei===0?'opacity:0.2;pointer-events:none':''}" onclick="bMove('${ex.uid}',-1)">▲</button>
          <button class="btn" style="padding:2px 6px;font-size:11px;border-color:var(--bord2);${ei===b.exercises.length-1?'opacity:0.2;pointer-events:none':''}" onclick="bMove('${ex.uid}',1)">▼</button>
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${ex.name}</div>
          <div style="font-size:11px;color:var(--mut)">${mgl(ex.mg)} · ${sets.length} sets</div>
        </div>
        <button class="btn bd" style="padding:5px 8px;flex-shrink:0" onclick="bRemEx('${ex.uid}')">✕</button>
      </div>
      <div class="ex-body">
        ${setRows}
        <button class="btn" style="margin-top:8px;padding:5px 12px;font-size:12px;border-color:var(--acc);color:var(--acc)" onclick="bAddSet('${ex.uid}')">+ Set toevoegen</button>
      </div>
    </div>`;
  }).join('');
}

function bPickHtml(){
  const added=S.builder.exercises.reduce((m,e)=>{m[e.exId]=(m[e.exId]||0)+1;return m},{});
  const rows=(EX[S.bmg]||[]).map(ex=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--bord)"><div><div style="font-size:15px">${ex.nm}</div><div style="font-size:11px;color:var(--mut)">${ex.tp}</div></div><div style="display:flex;align-items:center;gap:8px">${added[ex.id]?`<span style="font-size:11px;color:var(--acc);font-weight:700">×${added[ex.id]}</span>`:''}<button class="btn bp" style="padding:6px 12px" onclick="bAdd('${ex.id}','${S.bmg}','${ex.nm}')">+</button></div></div>`).join('');
  const custom=`<div style="margin-top:14px;padding-top:12px;border-top:1px dashed var(--bord2)"><div class="sl">Eigen oefening</div><div style="display:flex;gap:8px"><input type="text" id="custom-ex-input" placeholder="Naam oefening..." style="flex:1;padding:10px 12px;font-size:15px;font-family:inherit;background:var(--surf2);border:1px solid var(--bord2);border-radius:10px;color:var(--txt);outline:none" onfocus="this.style.borderColor='var(--acc)'" onblur="this.style.borderColor=''" onkeydown="if(event.key==='Enter')bAddCustom('${S.bmg}')"><button class="btn bp" style="padding:10px 14px;flex-shrink:0" onclick="bAddCustom('${S.bmg}')">+ Voeg toe</button></div></div>`;
  return rows+custom;
}

function bMGHtml(){return MG.map(m=>`<span class="chip ${S.bmg===m.id?'on':''}" onclick="bPickMG('${m.id}')">${m.lb}</span>`).join('');}

function bWarnHtml(){
  const vm={};S.builder.exercises.forEach(e=>{vm[e.mg]=(vm[e.mg]||0)+(e.sets?.length||4);});
  return Object.entries(vm).filter(([,s])=>s>20).map(([mg,s])=>`<div class="warn">⚠️ ${mgl(mg)}: ${s} sets — overweeg te verminderen</div>`).join('');
}

function htmlB(){
  const b=S.builder;if(!b)return'';
  return`<input class="inp" style="margin-bottom:14px" placeholder="Naam van de routine" value="${b.name.replace(/"/g,'&quot;')}" oninput="S.builder.name=this.value" onfocus="this.style.borderColor='var(--acc)'" onblur="this.style.borderColor=''" aria-label="Naam">${bWarnHtml()}<div class="sl" id="b-cnt">Oefeningen (${b.exercises.length})</div><div id="b-exs">${bExHtml()}</div><div class="div"></div><div class="sl">Oefening toevoegen</div><div id="b-mgs" style="display:flex;flex-wrap:wrap;margin-bottom:10px">${bMGHtml()}</div><div id="b-list">${bPickHtml()}</div>`;
}

function bRefresh(){const c=el('b-cnt'),x=el('b-exs'),l=el('b-list');if(c)c.textContent=`Oefeningen (${S.builder.exercises.length})`;if(x)x.innerHTML=bExHtml();if(l)l.innerHTML=bPickHtml();}
function bPickMG(mg){S.bmg=mg;const a=el('b-mgs'),b=el('b-list');if(a)a.innerHTML=bMGHtml();if(b)b.innerHTML=bPickHtml();}
function bAdd(exId,mg,name){S.builder.exercises.push(mkEx(exId,mg,name));bRefresh();}
function bAddCustom(mg){const input=el('custom-ex-input');if(!input)return;const name=input.value.trim();if(!name)return;const ex=mkEx('custom_'+uid(),mg,name);ex.custom=true;S.builder.exercises.push(ex);input.value='';bRefresh();}
function bRemEx(xuid){S.builder.exercises=S.builder.exercises.filter(x=>x.uid!==xuid);bRefresh();}
function bMove(xuid,dir){const exs=S.builder.exercises;const i=exs.findIndex(x=>x.uid===xuid);const j=i+dir;if(j<0||j>=exs.length)return;[exs[i],exs[j]]=[exs[j],exs[i]];bRefresh();}
function bUpdSet(xuid,si,f,v){const ex=S.builder.exercises.find(x=>x.uid===xuid);if(ex&&ex.sets[si])ex.sets[si][f]=v;}
function bAddSet(xuid){const ex=S.builder.exercises.find(x=>x.uid===xuid);if(!ex)return;const last=ex.sets[ex.sets.length-1]||{r:'8',w:0};ex.sets.push({r:last.r,w:last.w});bRefresh();}
function bRemSet(xuid,si){const ex=S.builder.exercises.find(x=>x.uid===xuid);if(!ex||ex.sets.length<=1)return;ex.sets.splice(si,1);bRefresh();}
function saveRoutine(){
  const b=S.builder;
  if(!b.name.trim()){alert('Geef de routine een naam.');return;}
  if(!b.exercises.length){alert('Voeg minimaal één oefening toe.');return;}
  const r={id:b.editId||uid(),name:b.name.trim(),exercises:b.exercises,createdAt:Date.now()};
  if(b.editId){const i=S.routines.findIndex(x=>x.id===b.editId);if(i>=0)S.routines[i]=r;else S.routines.push(r);}
  else S.routines.push(r);
  saveR();nav('routines');
}

// --- WORKOUT ---
function htmlW(){
  if(!S.active)return`<div class="empty"><span class="ico">⏸</span><p>Geen actieve workout.</p></div>`;
  const a=S.active,total=a.exercises.reduce((s,x)=>s+x.sets.length,0),done=a.exercises.reduce((s,x)=>s+x.sets.filter(z=>z.done).length,0),pct=total?Math.round(done/total*100):0;
  const cards=a.exercises.map(ex=>`
    <div class="card" style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div><div style="font-weight:600;font-size:15px">${ex.name}</div><div style="font-size:12px;color:var(--mut)">${mgl(ex.mg)}</div></div>
        <span style="font-size:12px;color:var(--suc);font-weight:700;font-family:monospace">${ex.sets.filter(s=>s.done).length}/${ex.sets.length} ✓</span>
      </div>
      ${ex.sets.map((s,i)=>`
        <div class="sr" id="sr-${ex.uid}-${i}" style="${s.done?'background:rgba(0,230,118,0.06);padding:7px 6px;border-radius:6px':''}">
          <span class="sn">S${i+1}</span>
          <span style="font-size:11px;color:var(--mut);min-width:36px">${s.tr}r</span>
          <input type="number" class="ni2 ni2w" min="0" max="999" step="0.5" value="${s.aw||s.tw||''}" placeholder="${s.tw||0}" oninput="updS('${ex.uid}',${i},'aw',+this.value)" aria-label="kg">
          <span class="lbl">kg</span>
          <span class="lbl">×</span>
          <input type="text" inputmode="text" class="ni2 ni2r" value="${s.ar||''}" placeholder="${s.tr}" oninput="updS('${ex.uid}',${i},'ar',this.value)" aria-label="reps">
          <span class="lbl">reps</span>
          <button class="ck ${s.done?'done':''}" id="ck-${ex.uid}-${i}" onclick="togS('${ex.uid}',${i})">✓</button>
        </div>`).join('')}
    </div>`).join('');
  return`<div class="card" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><span class="sl" style="margin:0">Voortgang</span><span id="prog-text" style="font-size:13px;font-family:monospace;font-weight:700;color:var(--acc)">${done}/${total} sets</span></div><div class="pb"><div class="pf" id="pbar" style="width:${pct}%"></div></div></div>${cards}<button class="btn bd fulbtn" style="margin-top:4px;padding:12px;font-size:15px" onclick="endW()">🏁 Workout afronden</button>`;
}

function togS(xuid,si){
  const ex=S.active.exercises.find(x=>x.uid===xuid);if(!ex)return;
  const s=ex.sets[si];s.done=!s.done;
  const btn=el(`ck-${xuid}-${si}`),row=el(`sr-${xuid}-${si}`);
  if(btn)btn.className='ck'+(s.done?' done':'');
  if(row){row.style.background=s.done?'rgba(0,230,118,0.06)':'';row.style.padding=s.done?'7px 6px':'7px 0';row.style.borderRadius=s.done?'6px':'';}
  const a=S.active,total=a.exercises.reduce((s,x)=>s+x.sets.length,0),done=a.exercises.reduce((s,x)=>s+x.sets.filter(z=>z.done).length,0);
  const pb=el('pbar'),pt=el('prog-text');
  if(pb)pb.style.width=Math.round(done/total*100)+'%';
  if(pt)pt.textContent=`${done}/${total} sets`;
  saveA();
}
function updS(xuid,si,f,v){const ex=S.active.exercises.find(x=>x.uid===xuid);if(ex&&ex.sets[si])ex.sets[si][f]=v;}
function endW(){
  if(!S.active)return;
  const dur=Date.now()-S.active.startTime;
  const done=S.active.exercises.reduce((s,x)=>s+x.sets.filter(z=>z.done).length,0);
  const vol=S.active.exercises.reduce((s,ex)=>s+ex.sets.filter(z=>z.done).reduce((ss,z)=>ss+(z.aw||z.tw)*(z.ar||z.tr),0),0);
  S.history.unshift({id:uid(),routineId:S.active.routineId,routineName:S.active.routineName,date:S.active.startTime,duration:dur,totalSets:done,totalVolume:Math.round(vol),exercises:S.active.exercises.map(e=>e.mg)});
  S.active=null;saveH();saveA();nav('history');
}

// --- WEIGHT ---
function weightGraph(){
  const sorted=[...S.weights].sort((a,b)=>a.date.localeCompare(b.date)).slice(-30);
  if(sorted.length<2)return`<p style="font-size:13px;color:var(--mut);text-align:center;padding:16px 0">Voeg minimaal 2 metingen toe voor een grafiek.</p>`;
  const vals=sorted.map(w=>w.weight),min=Math.min(...vals),max=Math.max(...vals),range=max-min||0.5;
  const W=320,H=120,pX=36,pY=12,plotW=W-pX*2,plotH=H-pY*2;
  const cx=i=>pX+(i/(sorted.length-1))*plotW;
  const cy=v=>pY+plotH-((v-min)/range)*plotH;
  const pts=sorted.map((w,i)=>`${cx(i).toFixed(1)},${cy(w.weight).toFixed(1)}`).join(' ');
  const dots=sorted.map((w,i)=>`<circle cx="${cx(i).toFixed(1)}" cy="${cy(w.weight).toFixed(1)}" r="3" fill="#00E5FF" stroke="#14141e" stroke-width="1.5"/>`).join('');
  const last=sorted[sorted.length-1];
  const idxs=sorted.length<=5?sorted.map((_,i)=>i):[0,sorted.length-1];
  const labels=idxs.map(i=>`<text x="${cx(i).toFixed(1)}" y="${H+12}" fill="#555" font-size="9" text-anchor="middle">${fmtDate(sorted[i].date)}</text>`).join('');
  return`<svg viewBox="0 0 ${W} ${H+16}" width="100%" style="overflow:visible;display:block;margin-top:8px"><defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#00E5FF" stop-opacity="0.15"/><stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/></linearGradient></defs><polygon points="${pts} ${cx(sorted.length-1).toFixed(1)},${pY+plotH} ${cx(0).toFixed(1)},${pY+plotH}" fill="url(#wg)"/><polyline points="${pts}" fill="none" stroke="#00E5FF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}<text x="${pX-4}" y="${(pY+4).toFixed(1)}" fill="#555" font-size="9" text-anchor="end">${max}kg</text><text x="${pX-4}" y="${(pY+plotH+4).toFixed(1)}" fill="#555" font-size="9" text-anchor="end">${min}kg</text><circle cx="${cx(sorted.length-1).toFixed(1)}" cy="${cy(last.weight).toFixed(1)}" r="5" fill="#00E5FF"/><text x="${(Math.min(cx(sorted.length-1)+8,W-28)).toFixed(1)}" y="${(cy(last.weight)+4).toFixed(1)}" fill="#00E5FF" font-size="10" font-weight="700">${last.weight}kg</text>${labels}</svg>`;
}

function htmlWt(){
  const sorted=[...S.weights].sort((a,b)=>b.date.localeCompare(a.date));
  const latest=sorted[0],prev=sorted[1];
  const diff=latest&&prev?+(latest.weight-prev.weight).toFixed(1):null;
  const statCard=latest?`<div class="card" style="margin-bottom:10px"><div style="display:flex;align-items:baseline;gap:10px;margin-bottom:4px"><span style="font-size:36px;font-weight:800;color:var(--acc);font-family:monospace;line-height:1">${latest.weight}</span><span style="font-size:18px;color:var(--mut)">kg</span>${diff!==null?`<span style="font-size:14px;font-weight:700;color:${diff<=0?'var(--suc)':'var(--dan)'};margin-left:4px">${diff>0?'+':''}${diff}kg</span>`:''}</div><div style="font-size:12px;color:var(--mut)">Laatste meting: ${fmtDate(latest.date)}</div></div>`:'';
  const graphCard=S.weights.length>=2?`<div class="card" style="margin-bottom:10px"><div class="sl">Gewichtsverloop</div>${weightGraph()}</div>`:'';
  const inputCard=`<div class="card" style="margin-bottom:10px"><div class="sl">Meting toevoegen</div><div style="display:flex;gap:8px;align-items:center"><input type="date" id="wt-date" value="${today()}" max="${today()}"><input class="ni2" type="number" id="wt-val" min="30" max="300" step="0.1" placeholder="kg" style="width:68px;padding:10px 4px"><span class="lbl">kg</span><button class="btn bp" style="padding:10px 16px;flex-shrink:0" onclick="addWeight()">+ Voeg toe</button></div></div>`;
  const listItems=sorted.slice(0,25).map((w,i)=>{const next=sorted[i+1];const d=next?+(w.weight-next.weight).toFixed(1):null;return`<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bord)"><div><div style="font-size:15px;font-weight:600">${w.weight} kg ${d!==null?`<span style="font-size:12px;font-weight:600;color:${d<=0?'var(--suc)':'var(--dan)'}">${d>0?'+':''}${d}kg</span>`:''}</div><div style="font-size:12px;color:var(--mut)">${fmtDate(w.date)}</div></div><button class="btn bd" style="padding:5px 9px" onclick="delWeight('${w.id}')">🗑</button></div>`;}).join('');
  const listCard=sorted.length?`<div class="card"><div class="sl">Geschiedenis</div>${listItems}</div>`:'';
  return statCard+inputCard+graphCard+listCard;
}
function addWeight(){const dateEl=el('wt-date'),valEl=el('wt-val');if(!dateEl||!valEl)return;const date=dateEl.value,weight=parseFloat(valEl.value);if(!date||!weight||weight<20||weight>400){alert('Vul een geldige datum en gewicht in.');return;}S.weights=S.weights.filter(w=>w.date!==date);S.weights.push({id:uid(),date,weight});saveW();valEl.value='';render();}
function delWeight(id){S.weights=S.weights.filter(w=>w.id!==id);saveW();render();}

// --- HISTORY ---
function delHistory(id){S.history=S.history.filter(x=>x.id!==id);saveH();render();}
function clearHistory(){if(!confirm('Hele historie wissen?'))return;S.history=[];saveH();render();}
function htmlH(){
  if(!S.history.length)return`<div class="empty"><span class="ico">📅</span><p style="font-size:15px">Nog geen afgeronde workouts.</p></div>`;
  return`<div style="display:flex;justify-content:flex-end;margin-bottom:10px"><button class="btn bd" style="padding:6px 12px;font-size:12px" onclick="clearHistory()">🗑 Alles wissen</button></div>`+S.history.map(w=>{const mgs=[...new Set(w.exercises)];const tags=mgs.map(m=>`<span style="display:inline-block;padding:3px 8px;border-radius:6px;font-size:11px;background:var(--surf2);color:var(--mut);border:1px solid var(--bord);margin-right:4px;margin-top:4px">${mgl(m)}</span>`).join('');return`<div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px"><div><div style="font-weight:600;font-size:15px;margin-bottom:2px">${w.routineName}</div><div style="font-size:13px;color:var(--mut)">${fmtD(w.date)} · ${fmtDur(w.duration)}</div>${w.totalVolume?`<div style="font-size:12px;color:var(--mut);margin-top:2px">Volume: ${w.totalVolume.toLocaleString('nl-NL')} kg·reps</div>`:''}</div><div style="display:flex;align-items:flex-start;gap:8px;flex-shrink:0"><div style="text-align:right"><div style="font-family:monospace;font-size:26px;font-weight:800;color:var(--acc)">${w.totalSets}</div><div style="font-size:11px;color:var(--mut)">sets</div></div><button class="btn bd" style="padding:5px 8px;margin-top:2px" onclick="delHistory('${w.id}')">🗑</button></div></div><div>${tags}</div></div>`;}).join('');
}

loadAll();checkImport();
if(S.active)S.view='workout';
render();
</script>

<div id="qr-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:999;align-items:center;justify-content:center;padding:20px">
  <div style="background:#14141e;border:1px solid #2a2a3a;border-radius:18px;padding:24px;max-width:300px;width:100%;text-align:center">
    <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.7px;color:#6b6b80;margin-bottom:6px">Routine delen</div>
    <div id="qr-title" style="font-weight:700;font-size:16px;color:#e8e8f0;margin-bottom:4px"></div>
    <div style="font-size:13px;color:#6b6b80;margin-bottom:16px">Maak een screenshot en stuur via WhatsApp.<br>Ontvanger scant met de camera.</div>
    <div style="background:#fff;padding:12px;border-radius:12px;display:inline-block;margin-bottom:16px">
      <div id="qr-code"></div>
    </div>
    <br>
    <button onclick="closeQR()" style="background:transparent;border:1px solid #2a2a3a;color:#e8e8f0;padding:10px 28px;border-radius:10px;font-size:14px;font-family:inherit;cursor:pointer">Sluiten</button>
  </div>
</div>

<div id="data-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:999;align-items:flex-end;justify-content:center">
  <div style="background:#14141e;border:1px solid #2a2a3a;border-radius:18px 18px 0 0;padding:24px;width:100%;max-width:500px;max-height:85vh;overflow-y:auto">
    <div style="font-size:16px;font-weight:700;color:#e8e8f0;margin-bottom:4px">📦 Data exporteren / importeren</div>
    <div style="font-size:13px;color:#6b6b80;margin-bottom:20px">Kopieer je data van dit apparaat naar een ander.</div>
    <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.7px;color:#6b6b80;margin-bottom:8px">Exporteren — kopieer deze code</div>
    <textarea id="export-box" readonly onclick="this.select()" style="width:100%;height:80px;background:#0d0d18;border:1px solid #2a2a3a;border-radius:10px;color:#00E5FF;font-family:monospace;font-size:11px;padding:10px;resize:none;outline:none"></textarea>
    <button onclick="copyExport()" style="width:100%;margin-top:8px;padding:10px;background:#00E5FF;border:none;border-radius:10px;color:#0a0a14;font-weight:700;font-size:14px;font-family:inherit;cursor:pointer">📋 Kopieer code</button>
    <div style="height:1px;background:#2a2a3a;margin:20px 0"></div>
    <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.7px;color:#6b6b80;margin-bottom:8px">Importeren — plak code van ander apparaat</div>
    <textarea id="import-box" placeholder="Plak hier de code..." style="width:100%;height:80px;background:#0d0d18;border:1px solid #2a2a3a;border-radius:10px;color:#e8e8f0;font-family:monospace;font-size:11px;padding:10px;resize:none;outline:none"></textarea>
    <button onclick="doImportAll()" style="width:100%;margin-top:8px;padding:10px;background:transparent;border:1px solid #00e676;border-radius:10px;color:#00e676;font-weight:700;font-size:14px;font-family:inherit;cursor:pointer">💾 Importeer data</button>
    <button onclick="closeData()" style="width:100%;margin-top:8px;padding:10px;background:transparent;border:1px solid #2a2a3a;border-radius:10px;color:#6b6b80;font-size:14px;font-family:inherit;cursor:pointer">Sluiten</button>
  </div>
</div>
</body>
